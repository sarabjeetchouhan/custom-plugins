<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
  <title id="title">SVG text poster</title>
  <desc id="desc">A typographic poster showing a title, quote, checklist, and footer.</desc>
  <rect width="820" height="620" fill="#111827"/>
  <rect x="34" y="34" width="752" height="552" rx="24" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <circle cx="700" cy="110" r="84" fill="#f97316" opacity=".9"/>
  <circle cx="735" cy="82" r="42" fill="#facc15" opacity=".9"/>

  <g font-family="sans-serif">
    <text x="82" y="112" font-size="18" letter-spacing="4" fill="#fb923c">SVG SAMPLE / 03</text>
    <text x="82" y="190" font-size="64" font-weight="800" fill="#f9fafb">Make it</text>
    <text x="82" y="258" font-size="64" font-weight="800" fill="#facc15">visible.</text>
    <text x="84" y="304" font-size="19" fill="#d1d5db">A text-focused SVG that demonstrates typography, spacing,</text>
    <text x="84" y="332" font-size="19" fill="#d1d5db">alignment, and accessible labels.</text>

    <rect x="82" y="374" width="656" height="2" fill="#4b5563"/>
    <g font-size="18" fill="#f9fafb">
      <circle cx="98" cy="420" r="8" fill="#22c55e"/>
      <text x="122" y="427">Keep the source easy to read</text>
      <circle cx="98" cy="468" r="8" fill="#22c55e"/>
      <text x="122" y="475">Use meaningful names and descriptions</text>
      <circle cx="98" cy="516" r="8" fill="#22c55e"/>
      <text x="122" y="523">Convert it to Markdown for review</text>
    </g>
    <text x="82" y="558" font-size="14" letter-spacing="2" fill="#9ca3af">DESIGN • DOCUMENT • SHARE</text>
  </g>
</svg>
